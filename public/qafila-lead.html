<!DOCTYPE html>
<html>
  <body>
    <!-- Static skeleton for Netlify Forms build-time detection. Never shown to users. -->
    <form name="qafila-lead" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="client-name" />
      <input type="tel" name="client-phone" />
      <input type="text" name="client-company" />
      <select name="target-mod">
        <option value="SGP">SGP</option>
        <option value="FAP">FAP</option>
        <option value="VML">VML</option>
        <option value="ALL">ALL</option>
      </select>
      <textarea name="client-note"></textarea>
    </form>
  </body>
</html>
